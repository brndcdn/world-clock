<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.5/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock - Brenda</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select name="" id="">
        <option value="">Select a city...</option>
        <option value="">Bogota</option>
        <option value="">Rome</option>
        <option value="">Brisbane</option>
      </select>

      <div class="city" id="bogota">
        <div>
          <h2>Bogota 🇨🇴</h2>
          <div class="date"></div>
        </div>
        <div>
          <div class="time"></div>
        </div>
      </div>

      <div class="city" id="rome">
        <div>
          <h2>Rome 🇮🇹</h2>
          <div class="date"></div>
        </div>
        <div>
          <div class="time"></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded by <strong>Brenda Cadena</strong> and is
      <a href="https://github.com/brndcdn/world-clock" target="_blank"
        >open sourced on GitHub</a
      >.
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
